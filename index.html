<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Movie Collection</title>
  </head>

  <body>
    <main id="app-wrapper">
      <header>
        <h1>Movie Collection Web Application</h1>
        <p>
          A simple web application that showcases a collection of movies using
          HTML, CSS and Vanilla JavaScript.
        </p>
      </header>

      <!-- Search and filter placeholder elements -->
      <section>
        <input type="text" placeholder="Search movies..." />
        <select>
          <option value="">All Genres</option>
        </select>
      </section>

      <section id="movie-container-wrapper">
        <h2>All Genres</h2>
        <section class="movie-container" id="movieContainer"></section>
      </section>
    </main>
    <script src="js/app.js"></script>
  </body>
</html>
