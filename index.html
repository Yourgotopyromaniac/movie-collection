<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Movie Collection</title>
  </head>

  <body>
    <main>
      <section>
        <h1>Movie Collection Web Application</h1>
      </section>

      <!-- movie collection grid -->
      <section class="movie-container">
        <!-- individual card -->
        <div class="card">
          <img src="./images/chainsawMan.jpg" id="poster" alt="" />
          <div class="card-text">
            <p id="title">Chainsaw Man: Reze Arc</p>
            <span class="title-container">
              <p id="release-year">2025</p>
              <p id="genre">Action</p>
            </span>
            <p id="description">
              A direct sequel to the first season of the series 'Chainsaw Man',
              featuring Denji, a young man who co-exists with a chainsaw demon.
              Denji encounters a new romantic interest, but will his involvement
              place them both in danger?
            </p>
          </div>
        </div>

        <!-- remaining individual cards -->
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
        <div class="card"></div>
      </section>
    </main>
  </body>
</html>
